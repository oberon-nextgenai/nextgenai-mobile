server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted JS/CSS/asset bundles
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be long-cached: browsers re-check it on
    # navigation to pick up new push/notification logic. The catch-all below
    # already serves no-cache, but this stays explicit so a future tightening
    # of `/` cannot silently freeze deployed workers.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: expo-router routes are client-side, so unknown paths
    # must return index.html rather than 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
